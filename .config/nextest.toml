# Refuse to run under a nextest older than the fixed release: GHSA-vc25-qg58-w57c is fixed in
# 0.9.150, and CI installs exactly that version (an older nextest exits 92 REQUIRED_VERSION_NOT_MET).
nextest-version = "0.9.150"

# `cargo nextest run` (used by `cargo xtask ci`) runs every test in a process of its own, in parallel.

[test-groups]
# NVENC sessions are a limited resource on consumer GPUs.
nvenc = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(filmcraft-platform) and (binary(/nvenc/) or test(/nvenc/))"
test-group = "nvenc"

# A throughput gate: it measures one core's speed, so nothing else runs beside it.
[[profile.default.overrides]]
filter = "package(filmcraft-render) and binary(mixer_perf)"
threads-required = "num-test-threads"

# Real-time audio: a wall-clock device takes a period every 10.7 ms, and the mixer thread must
# stay ahead of it. With other tests' processes busy on every core, the thread isn't scheduled in
# time and the device plays silence (Windows runners, #4649), so nothing runs beside them.
[[profile.default.overrides]]
filter = "package(filmcraft-ui-egui) and binary(play_ahead)"
threads-required = "num-test-threads"

# Playback during a value drag (#1673) is a timing test: a frame counts only if it finishes
# within 64 revisions, and the drag makes one per UI pass. With other tests beside it on a 4-core
# runner the picture barely moved (2 of 3 mirror CI runs, 2026-11-25); alone it passed every time,
# even held to four M1 efficiency cores.
[[profile.default.overrides]]
filter = "package(filmcraft-ui-egui) and binary(it) and test(=perf_ui::program_monitor_plays_on_while_a_value_is_dragged)"
threads-required = "num-test-threads"
